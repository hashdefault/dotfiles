"$schema" = "https://starship.rs/config-schema.json"

# Amber Powerline for xonsh + Starship.
# Requires a Nerd Font for the icons and separators to render correctly.

format = """
$os$username[](fg:primary bg:accent_dir)\
$directory[](fg:accent_dir) \
 $git_branch$git_status$git_state$c$rust$golang$nodejs$python$php$java$docker_context
$character"""

palette = "amber"
add_newline = true
command_timeout = 700

[palettes.amber]
bg_dark       = "#0a0a0a"
text_light    = "#f5ead8"
text_dim      = "#cab99d"
primary       = "#ffb454"
neon_green    = "#9fbf6e"
neon_cyan     = "#4fa8a0"
neon_magenta  = "#c98a5e"
neon_pink     = "#ff6a3d"
neon_yellow   = "#ffd27a"
red           = "#ff5f4d"
blue          = "#5f8fae"
muted         = "#a08a63"
muted2        = "#6b5636"
accent_dir    = "#ff6a3d"
accent_git    = "#4fa8a0"
accent_lang   = "#5f8fae"
accent_docker = "#cab99d"
accent_time   = "#6b5636"

[os]
disabled = false
style = "bg:primary fg:bg_dark"

[os.symbols]
Arch = "󰣇"
CachyOS = "󰣇"
Linux = "󰌽"
Ubuntu = "󰕈"
Debian = "󰣚"
Macos = "󰀵"
Windows = "󰍲"

[username]
show_always = true
style_user = "bg:primary fg:bg_dark"
style_root = "bg:primary fg:bg_dark"
format = "[ $user ]($style)"
disabled = false

[directory]
style = "bg:accent_dir fg:text_light"
format = "[ 󰉋 $path ]($style)"
truncation_length = 4
truncation_symbol = "…/"
read_only = " 󰌾"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = "󰇚 "
"Music" = "󰝚 "
"Pictures" = "󰉏 "
"Projects" = "󰲋 "

[git_branch]
symbol = "󰘬"
style = "bg:accent_git fg:text_light"
format = "[](fg:accent_git)[ $symbol $branch ]($style)"

[git_status]
style = "bg:accent_git fg:text_light"
format = "([ $all_status$ahead_behind]($style))"
conflicted = "󰞇 "
ahead = "󰜷${count} "
behind = "󰜮${count} "
diverged = "󰹺${count} "
untracked = "?${count} "
stashed = "󰏗${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "󰅙${count} "

[git_state]
style = "bg:accent_git fg:text_light"
format = "([ $state $progress_current/$progress_total ]($style))"

[c]
symbol = ""
style = "bg:accent_lang fg:text_light"
format = " [](fg:accent_lang)[ $symbol ($version) ]($style)"

[rust]
symbol = ""
style = "bg:accent_lang fg:text_light"
format = " [](fg:accent_lang)[ $symbol ($version) ]($style)"

[golang]
symbol = ""
style = "bg:accent_lang fg:text_light"
format = " [](fg:accent_lang)[ $symbol ($version) ]($style)"

[nodejs]
symbol = ""
style = "bg:accent_lang fg:text_light"
format = " [](fg:accent_lang)[ $symbol ($version) ]($style)"

[python]
symbol = ""
style = "bg:accent_lang fg:text_light"
format = " [](fg:accent_lang)[ $symbol ($version)(\\($virtualenv\\)) ]($style)"

[php]
symbol = ""
style = "bg:accent_lang fg:text_light"
format = " [](fg:accent_lang)[ $symbol ($version) ]($style)"

[java]
symbol = ""
style = "bg:accent_lang fg:text_light"
format = " [](fg:accent_lang)[ $symbol ($version) ]($style)"

[docker_context]
symbol = "󰡨"
style = "bg:accent_docker fg:bg_dark"
format = " [](fg:accent_docker)[ $symbol $context ]($style)"
only_with_files = true

[cmd_duration]
disabled = true

[time]
disabled = true

[character]
success_symbol = "[❯](bold fg:primary)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:neon_yellow)"

[package]
disabled = true

[shlvl]
disabled = true
