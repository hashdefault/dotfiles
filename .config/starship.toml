# Starship prompt - muted theme

add_newline = false

format = """
[╭─](bold #5d6a7d)$os$username[@](bold #8a95a5)$hostname$directory$git_branch$git_status$cmd_duration
[╰─](bold #5d6a7d)$character"""

palette = "muted"

[palettes.muted]
gray_light = "#8a95a5"
gray = "#5d6a7d"
gray_dark = "#4b5563"
accent = "#5a9ac7"
success = "#5aad5a"
warning = "#d4a24d"
error = "#c96666"

[os]
disabled = false
style = "bold #5a9ac7"
format = "[$symbol]($style) "

[os.symbols]
Arch = "󰣇"
Linux = "🐧"
CachyOS = "🐧"
Macos = ""
Windows = "󰍲"

[character]
success_symbol = "[»](bold #5a9ac7)"
error_symbol = "[»](bold #c96666)"
vimcmd_symbol = "[»](bold #8a95a5)"

[username]
style_user = "bold #8a95a5"
style_root = "bold #c96666"
format = "[$user]($style)"
disabled = false
show_always = true

[hostname]
ssh_only = false
style = "bold #5affff"
format = "[$hostname]($style) "
disabled = false

[directory]
home_symbol = " 󰜥 "
read_only = " 󰌾 "
style = "underline bold #5a9ac7"
truncation_length = 4
truncation_symbol = "…/"
format = "[](bold #5a9ac7)[$path]($style)[$read_only](#c96666)[](bold #5a9ac7) "

#[directory.substitutions]
#"Desktop" = " 󰇄 "
#"Documents" = " 󰈙 "
#"Downloads" = " 󰇚 "
#"Music" = " 󰎈 "
#"Pictures" = " 󰋩 "
#"Videos" = " 󰕧 "
#"GitHub" = " 󰊤 "
#".config" = " 󰒓 "

[git_branch]
symbol = "󰘬"
style = "bold #5aad5a"
truncation_length = 20
truncation_symbol = "…"
format = "[](bold #5aad5a)[$symbol $branch(:$remote_branch)]($style)[](bold #5aad5a) "

[git_commit]
commit_hash_length = 6
tag_symbol = " 󰓹 "
style = "#d4a24d"

[git_state]
format = '[\($state( $progress_current/$progress_total)\)]($style) '
cherry_pick = "[ CHERRY](bold #c96666)"
rebase = "[󰳖 REBASE](bold #8a95a5)"
merge = "[󰘭 MERGE](bold #5a9ac7)"
bisect = "[ BISECT](bold #d4a24d)"

[git_status]
style = "bold #d4a24d"
format = '([$all_status$ahead_behind]($style))'
conflicted = "[ ${count}](bold #c96666)"
ahead = "[󰜷 ${count}](#5aad5a)"
behind = "[󰜮 ${count}](#c96666)"
diverged = "[󰹹 ${ahead_count}/${behind_count}](#8a95a5)"
untracked = "[󰋗 ${count}](#5a9ac7)"
stashed = "[󰆓 ${count}](#8a95a5)"
modified = "[󰏫 ${count}](#d4a24d)"
staged = "[󰸞 ${count}](#5aad5a)"
renamed = "[󰑕 ${count}](#5a9ac7)"
deleted = "[󰆴 ${count}](#c96666)"

[cmd_duration]
min_time = 500
style = "bold #d4a24d"
format = "[](bold #d4a24d)[󱎫 $duration]($style)[](bold #d4a24d)"

[package]
disabled = true

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = 75
symbol = "󰍛 "
style = "bold #c96666"
format = "[${symbol}${ram_pct}]($style) "

[time]
disabled = true
style = "#5a9ac7"
format = "[󰥔 $time]($style) "
time_format = "%H:%M"

[battery]
disabled = true
full_symbol = "󰁹"
charging_symbol = "󰂄"
discharging_symbol = "󰂃"

[[battery.display]]
threshold = 20
style = "bold #c96666"

[status]
disabled = false
symbol = "󰀨"
style = "bold #c96666"
format = '[$symbol $status]($style) '
