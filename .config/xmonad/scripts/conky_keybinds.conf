conky.text = [[
${color1}XMonad Keybinds${color}


${color1}Launchers${color}
 Mod+Shift+Enter  Terminal (Ghostty)
 Mod+r            Rofi (drun)
 Mod+p            Dmenu
 Mod+s            EWW sidebar (toggle)
 Mod+F1           Lock screen

${color1}Windows & Focus${color}
 Mod+Tab/j/k      Cycle focus next/prev
 Mod+m            Focus master
 Mod+o            Swap with master
 Mod+Shift+j/k    Swap next/prev
 Mod+t            Sink (tile) focused

${color1}Layouts${color}
 Mod+Space        Next layout
 Mod+f            Toggle floats
 Mod+Shift+f      Toggle fullscreen
 Mod+Ctrl+=/-     Inc/Dec window limit

${color1}Resize Master${color}
 Mod+h / Mod+l    Shrink / Expand
 Mod+, / Mod+.    Inc / Dec master count

${color1}Gaps${color}
 Mod+Ctrl+g       Toggle gaps
 Mod+Shift+g      Reset gaps
 Mod+Ctrl+t/y/u/i Inc L/T/B/R gap
 Mod+Shift+t/y/u/i Dec L/T/B/R gap

${color1}Workspaces & Screens${color}
 Mod+[1..9]       View workspace
 Mod+Shift+[1..9] Move window to workspace
 Mod+w/e          View screen 1/2
 Mod+Shift+w/e    Move window to screen 1/2

${color1}System${color}
 Mod+q            Recompile + Restart xmonad
 Mod+Shift+q      Power menu

${color1}Help${color}
 Mod+i            Toggle this guide
]]
