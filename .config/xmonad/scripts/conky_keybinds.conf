conky.config = {
  alignment = 'top_left',
  gap_x = 20,
  gap_y = 60,
  minimum_width = 520,
  own_window = true,
  own_window_type = 'override',
  own_window_argb_visual = true,
  own_window_argb_value = 0,
  own_window_colour = '#000000',
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  double_buffer = true,
  use_xft = true,
  font = 'JetBrains Mono Nerd Font:size=10',
  draw_shades = false,
  draw_outline = false,
  draw_borders = false,
  default_color = '#dddddd',
  color1 = '#5bb1d3',
  color2 = '#cccccc',
  update_interval = 2.0,
  cpu_avg_samples = 2,
  net_avg_samples = 2,
  uppercase = false,
  no_buffers = true,
  text_buffer_size = 2048,
