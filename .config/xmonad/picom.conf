# Conservative XMonad profile. Other desktops keep their own Picom config.
backend = "glx";
vsync = true;
# Repaint the entire screen to avoid damage-tracking artifacts. This costs
# more GPU work than partial repainting, especially on multiple monitors.
use-damage = false;
unredir-if-possible = false;

# Avoid blur and opacity transitions while windows map, resize, or focus.
blur-background = false;
blur-method = "none";
fading = false;
animations = ();
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
corner-radius = 0;
shadow = false;
log-level = "warn";
