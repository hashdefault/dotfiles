# Colors come from theme.toml, regenerated by
# ~/.config/xmonad/scripts/theme-chooser.sh (or the Hyprland chooser).
# Alacritty merges imports with the main file, but the main file's own keys win over
# an import's -- so [colors.*] must NOT be redefined here, only in
# theme.toml, or theme switching silently stops working.
[general]
import = ["/home/lucas/.config/alacritty/theme.toml"]
live_config_reload = true

[cursor]
blink_interval = 500

[cursor.style]
blinking = "Always"
shape = "block"

[env]
TERM = "alacritty"

[font]
size = 15

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[scrolling]
history = 1000
multiplier = 3

[terminal.shell]
program = "/usr/bin/fish"

[window]
decorations = "full"
dynamic_title = true
opacity = 0.9
startup_mode = "Windowed"
title = "Alacritty"

[window.padding]
x = 10
y = 10

[terminal]

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
