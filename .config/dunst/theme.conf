# Eldritch colorscheme for dunst
# Palette reference (eldritch.nvim):
#   bg          #212337   bg_highlight #292e42   fg_gutter #3b3f5c
#   fg          #ebfafa   comment      #7081d0
#   blue/cyan   #04d1f9   green        #37f499
#   purple      #a48cf2   orange       #f0a45d
#   red         #f16c75

[global]
frame_color = "#7081d0"
separator_color = "#3b3f5c"
highlight = "#a48cf2, #04d1f9"

[urgency_low]
background = "#212337"
foreground = "#a4a9c0"
frame_color = "#04d1f9"
highlight = "#04d1f9, #a48cf2"

[urgency_normal]
background = "#212337"
foreground = "#ebfafa"
frame_color = "#37f499"
highlight = "#37f499, #04d1f9"

[urgency_critical]
background = "#292e42"
foreground = "#ebfafa"
frame_color = "#f16c75"
highlight = "#f16c75, #f0a45d"
