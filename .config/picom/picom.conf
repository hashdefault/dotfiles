#################################
#          Animations           #
#################################
# picom v13+ native animations
animations = (
  {
    triggers = ["open", "show"];
    opacity = {
      timing = "200ms linear";
      start = 0;
      end = "window-raw-opacity-before";
    };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    scale-x = {
      timing = "200ms cubic-bezier(0.21, 0.02, 0.76, 0.36)";
      start = 0.9;
      end = 1;
    };
    scale-y = "scale-x";
  },
  {
    triggers = ["close", "hide"];
    opacity = {
      timing = "200ms linear";
      start = "window-raw-opacity-before";
      end = 0;
    };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    scale-x = {
      timing = "200ms cubic-bezier(0.21, 0.02, 0.76, 0.36)";
      start = 1;
      end = 0.9;
    };
    scale-y = "scale-x";
  },
  {
    triggers = ["geometry"];
    scale-x = {
      timing = "200ms cubic-bezier(0.21, 0.02, 0.76, 0.36)";
      start = "window-width-before / window-width";
      end = 1;
    };
    scale-y = {
      timing = "200ms cubic-bezier(0.21, 0.02, 0.76, 0.36)";
      start = "window-height-before / window-height";
      end = 1;
    };
    offset-x = {
      timing = "200ms cubic-bezier(0.21, 0.02, 0.76, 0.36)";
      start = "window-x-before - window-x";
      end = 0;
    };
    offset-y = {
      timing = "200ms cubic-bezier(0.21, 0.02, 0.76, 0.36)";
      start = "window-y-before - window-y";
      end = 0;
    };
  }
);


#################################
#             Corners           #
#################################
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'awesome'",
  "class_g = 'Polybar'",
  "class_g = 'code-oss'",
  "class_g = 'firefox'",
  "class_g = 'Thunderbird'",
  "QTILE_INTERNAL:32c = 1",
];


#################################
#             Shadows           #
#################################
shadow = false;
shadow-radius = 5;
shadow-offset-x = -5;
shadow-offset-y = -5;

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g = 'slop'",
  "class_g = 'Polybar'",
  "window_type = 'dock'",
  "_GTK_FRAME_EXTENTS@:c",
];


#################################
#           Fading              #
#################################
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.05;

fade-exclude = [
  "class_g = 'slop'",
];


#################################
#   Transparency / Opacity      #
#################################
inactive-opacity = 0.95;
frame-opacity = 0.95;
inactive-opacity-override = false;
active-opacity = 1.0;

focus-exclude = [
  "class_g = 'Cairo-clock'",
  "class_g = 'Bar'",
  "class_g = 'slop'",
];

opacity-rule = [
  "80:class_g     = 'Bar'",
  "100:class_g    = 'slop'",
  "70:class_g     = 'TelegramDesktop'",
  "90:class_g     = 'Joplin'",
  "100:class_g    = 'firefox'",
  "100:class_g    = 'Thunderbird'",
  "100:class_g    = 'Plank'",
  "100:class_g    = 'Cairo-dock'",
  "100:window_type = 'dock'",
];


#################################
#     Background-Blurring       #
#################################
blur: {
  method = "dual_kawase";
  strength = 3;
  background = true;
  background-frame = true;
  background-fixed = false;
  kern = "3x3box";
};

blur-background-exclude = [
  "class_g = 'slop'",
  "class_g = 'dock'",
  "class_g = 'tooltip'",
  "window_type = 'dock'",
  "window_type = 'menu'",
  "_GTK_FRAME_EXTENTS@:c",
];


#################################
#       General Settings        #
#################################
backend = "glx";
vsync = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
use-damage = true;
log-level = "info";

wintypes:
{
  normal = { fade = false; shadow = false; };
  tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; full-shadow = false; blur = false; };
  dock = { shadow = false; fade = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; blur = false; shadow = false; };
  dropdown_menu = { opacity = 0.95; blur = false; shadow = false; };
};
