#################################
#             Corners           #
#################################
corner-radius = 5;
rounded-corners-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "class_g = 'awesome'",
  "class_g = 'Polybar'",
  "class_g = 'code-oss'",
  "class_g = 'Thunderbird'",
];


#################################
#             Shadows           #
#################################
shadow = true;
shadow-radius = 12;
shadow-offset-x = -7;
shadow-offset-y = -7;

shadow-exclude = [
  "window_type = 'dock'",
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g = 'slop'",
  "class_g = 'Polybar'",
  #"_GTK_FRAME_EXTENTS@",
];


#################################
#           Fading              #
#################################
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.05;

fade-exclude = [
  "class_g = 'slop'",
];


#################################
#   Transparency / Opacity      #
#################################
inactive-opacity = 0.98;
frame-opacity = 0.98;
inactive-opacity-override = false;
active-opacity = 1.0;

focus-exclude = [
  "class_g = 'Cairo-clock'",
  "class_g = 'Bar'",
  "class_g = 'slop'",
  "class_g = 'Trayer'",
  "class_g = 'trayer'",
  #"QTILE_INTERNAL = 1",
];

opacity-rule = [
  "90:class_g     = 'Bar'",
  "100:class_g    = 'slop'",
  "100:class_g     = 'TelegramDesktop'",
  "100:class_g     = 'Joplin'",
  "100:class_g    = 'firefox'",
  "100:class_g    = 'librewolf'",
  "100:class_g    = 'chromium'",
  "100:class_g    = 'Thunderbird'",
  "100:class_g    = 'Plank'",
  "100:class_g    = 'com.mitchellh.ghostty'",
  "90:class_g    = 'Alacritty'",
  "90:class_g    = 'Rofi'",
  "90:class_g    = 'kitty'",
  "100:class_g    = 'Trayer'",
  "100:class_g    = 'trayer'",
  "100:class_g    = 'Brave'",
  "100:class_g    = 'org.wezfurlong.wezterm'",
  "100:class_g    = 'XTerm'",
  "100:class_g    = 'URxvt'",
  "100:class_g    = 'st-256color'",
  "100:class_g    = 'Cairo-dock'",
  "100:window_type = 'dock'",
];


#################################
#     Background-Blurring       #
#################################
# Disable blur for stability. Re-enable only after the compositor is
# confirmed stable with your driver/backend combination.
blur-background = true;
blur: {
   method = "dual_kawase";
   strength = 3;
 };

blur-background-exclude = [
  "class_g = 'slop'",
  "class_g = 'dock'",
  "class_g = 'tooltip'",
  "window_type = 'dock'",
  "window_type = 'menu'",
  #"_GTK_FRAME_EXTENTS@",
  #"QTILE_INTERNAL = 1",
];



#################################
#       General Settings        #
#################################
backend = "glx";
vsync = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = false;
detect-transient = true;
detect-client-leader = false;
use-damage = true;
unredir-if-possible = false;
log-level = "info";

wintypes:
{
  normal = { fade = false; shadow = false; };
  tooltip = { fade = true; shadow = true; opacity = 0.98; focus = true; full-shadow = false; blur = false; };
  dock = { shadow = false; fade = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.98; blur = false; shadow = false; };
  dropdown_menu = { opacity = 0.98; blur = false; shadow = false; };
};
